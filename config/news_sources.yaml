# ============================================================
# News RSS source list + importance rules (architecture §1.4, review P1-3, Fix round R3 Chinese sources landed)
# Copyright boundary: store only title + source + link + self-written summary, never the full text (PRD §24).
# T03's RssNewsProvider collects from this file; a single source failure only degrades, never interrupts (architecture §8.8).
# ============================================================
version: "1.0.0"

sources:
  # English sources (free RSS)
  - { id: cnbc, name: CNBC, url: "https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", lang: en, weight: 3 }
  - { id: marketwatch, name: MarketWatch, url: "https://feeds.content.dowjones.io/public/rss/mw_topstories", lang: en, weight: 2 }
  - { id: investing, name: Investing.com, url: "https://www.investing.com/rss/news.rss", lang: en, weight: 2 }
  - { id: fed, name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml", lang: en, weight: 4, category: central_bank }
  # Chinese sources (landed in R3; enabled defaults to true, an unreachable single source is marked degraded by the Provider rather than crashing)
  # Eastmoney official RSS (verified reachable 2026-08, 95 items/fetch) — authoritative official source
  - { id: eastmoney, name: 东方财富, url: "https://rss.eastmoney.com/rss_partener.xml", lang: zh, weight: 3 }
  # CLS (no official RSS) → via the public RSSHub instance /cls/telegraph; public instances may 403/rate-limit
  # → Provider degrades per source (degraded) without blocking other sources; production can self-host RSSHub and replace the url
  - { id: clschina, name: 财联社, url: "https://rsshub.app/cls/telegraph", lang: zh, weight: 4 }
  # Wallstreetcn: official rss.xml (https://wallstreetcn.com/rss.xml) returned S3
  # NoSuchKey when verified 2026-08 (no publicly available official RSS) → use the RSSHub route /wallstreetcn/news; degrade when unreachable
  - { id: wallstreetcn, name: 华尔街见闻, url: "https://rsshub.app/wallstreetcn/news", lang: zh, weight: 3 }

# Importance scoring rules (0-100): source weight + keywords + asset hits + recency
importance:
  source_weight: 30
  keyword_weight: 30
  asset_hit_weight: 20
  recency_weight: 20
  keywords:
    high:
      - "fed"
      - "rate decision"
      - "cpi"
      - "nvidia"
      - "micron"
      - "memory"
      - "dram"
      - "yield curve"
      - "recession"
      - "美联储"
      - "利率决议"
      - "通胀"
      - "存储"
      - "减产"

