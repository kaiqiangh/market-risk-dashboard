# ============================================================
# Data source configuration: Provider registry / fallback order / expected update frequency (architecture §1.4, §8.5)
# T03's ProviderRegistry registers each domain's primary/backup providers and fallback chain from this file.
# ============================================================
schema_version: "1.0.0"

# Expected update frequency (frozen G4; kept in sync with the frontend src/lib/freshness.ts)
expectations:
  market: { interval_minutes: 480, note: "Market/data and news 2-3 times/day" }
  news: { interval_minutes: 480, note: "2-3 times/day" }
  macro:
    { interval_minutes: 240, note: "Macro 2-4h (FRED is actually T+1; judged by release schedule)" }
  calendar: { interval_minutes: 1440, note: "Earnings calendar once per day" }
  analysis: { interval_minutes: 720, note: "AI briefs 2 times/day" }
  risk: { interval_minutes: 480, note: "Risk model recalculated with pipeline 2-3 times/day" }
  dashboard:
    { interval_minutes: 480, note: "Homepage aggregation recalculated with pipeline 2-3 times/day" }

# Provider registry (smaller priority number = higher priority)
providers:
  quotes:
    - { name: yfinance, priority: 1, kind: primary }
    - { name: stooq, priority: 2, kind: fallback }
  macro:
    - { name: fred, priority: 1, kind: primary }
  crypto:
    - { name: coingecko, priority: 1, kind: primary }
    - { name: binance_public, priority: 2, kind: fallback, enabled: false }
  calendar:
    - { name: fmp, priority: 1, kind: primary }
    - { name: yfinance, priority: 2, kind: fallback }
  a_share:
    - { name: akshare, priority: 1, kind: primary }
  news:
    - { name: rss_news, priority: 1, kind: primary }

# Fallback chain (architecture §1.4)
degrade:
  max_retries: 2
  backoff_base_seconds: 1.0
  jitter: true
  cache_max_age_hours: 24
  data_quality_degrade_factor: 0.8
  last_good_cache_dir: "artifacts/cache"
