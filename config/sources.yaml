# ============================================================
# Data source configuration: Provider registry / fallback order / expected update frequency (architecture §1.4, §8.5)
# T03's ProviderRegistry registers each domain's primary/backup providers and fallback chain from this file.
# ============================================================
schema_version: "1.0.0"

# Expected update frequency, keyed by canonical dataset key (pipeline/schemas/registry.py).
#
# Previously keyed by a mixture of dataset names and provider domains: `market` covered three
# datasets while `equities`/`sectors`/`crypto` had no entry at all and silently fell back to
# 480, and `risk` was read as 480 by the envelope but 720 by CI. One key per dataset, and
# every canonical key must appear here — a config drift test enforces both directions (N-1).
#
# The frontend reads these through the generated src/schemas/generated/constants.json rather
# than keeping its own copy in src/lib/freshness.ts.
expectations:
  equities: { interval_minutes: 480, note: "Market data 2-3 times/day" }
  sectors: { interval_minutes: 480, note: "Sector/theme aggregation runs with market collection" }
  crypto: { interval_minutes: 480, note: "Crypto 2-3 times/day, alongside market" }
  macro:
    { interval_minutes: 240, note: "Macro 2-4h (FRED is actually T+1; judged by release schedule)" }
  calendar: { interval_minutes: 1440, note: "Economic and earnings calendar once per day" }
  news: { interval_minutes: 480, note: "2-3 times/day" }
  risk: { interval_minutes: 480, note: "Risk model recalculated with pipeline 2-3 times/day" }
  dashboard:
    { interval_minutes: 480, note: "Homepage aggregation recalculated with pipeline 2-3 times/day" }
  factlayer: { interval_minutes: 480, note: "Fact layer rebuilt on every pipeline run" }
  analysis: { interval_minutes: 720, note: "AI briefs 2 times/day" }
  news_translations:
    { interval_minutes: 720, note: "Chinese translations produced by the AI brief automations" }

# Provider registry (smaller priority number = higher priority). LIVE config since #102:
# build_default_providers() constructs exactly these providers, in this order, skipping
# enabled: false (C-3). `kind` is descriptive (primary/fallback); the effective order is
# `priority`.
providers:
  quotes:
    - { name: yfinance, priority: 1, kind: primary }
    - { name: stooq, priority: 2, kind: fallback }
  macro:
    - { name: fred, priority: 1, kind: primary }
  crypto:
    - { name: coingecko, priority: 1, kind: primary }
    # Not implemented yet — the disabled entry is inert (never constructed), not a typo gate.
    - { name: binance_public, priority: 2, kind: fallback, enabled: false }
  calendar:
    - { name: fmp, priority: 1, kind: primary }
    - { name: yfinance_calendar, priority: 2, kind: fallback }
  a_share:
    - { name: akshare, priority: 1, kind: primary }
  news:
    - { name: rss_news, priority: 1, kind: primary }

# Fallback chain (architecture §1.4)
degrade:
  max_retries: 2
  backoff_base_seconds: 1.0
  jitter: true
  cache_max_age_hours: 24
  data_quality_degrade_factor: 0.8
  last_good_cache_dir: "artifacts/cache"

# Operations knobs (M-5): tuning constants that used to be magic literals in the collectors.
# Model parameters (4.0/105/1.5, fact-layer slices 15/20/5/8) deliberately stay in Python as
# named constants with a derivation comment.
operations:
  circuit_breaker_threshold: 2
  calendar_horizon_days: 14
  news_max_items: 50
  news_summary_max_chars: 160
  recency_half_life_hours: 48.0

