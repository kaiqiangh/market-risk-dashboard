# ============================================================
# 风险模型配置（架构 §3.2 冻结 6 维权重；可配置 + 重归一化）
# 某维 coverage=0 时，其权重按剩余维度权重比例重新分配，
# 同时 confidence_factors.coverage 相应下调。
# ============================================================
model_version: "1.0.0"

dimensions:
  macro: { weight: 20 }
  liquidity_credit: { weight: 20 }
  equity_structure: { weight: 20 }
  volatility: { weight: 15 }
  cross_asset: { weight: 15 }
  trend: { weight: 10 }

# 各维指标映射（MVP 级；T03 实现时按此表填充 indicators，详细信号清单以本文件为准）
indicators:
  macro:
    - { key: real_rate_dfii10, source: FRED, metric: DFII10, label: "10Y 实际利率" }
    - { key: yield_curve_10y2y, source: FRED, metric: DGS10-DGS2, label: "10Y-2Y 期限利差" }
    - { key: inflation_surprise, source: FRED, metric: CPIAUCSL, label: "通胀 Surprise" }
    - { key: labor_deterioration, source: FRED, metric: UNRATE/PAYEMS, label: "就业恶化速度" }
    - { key: dollar_index, source: FRED, metric: DTWEXBGS, label: "美元指数" }
  liquidity_credit:
    - { key: hy_oas, source: FRED, metric: BAMLH0A0HYM2, label: "高收益 OAS" }
    - { key: ig_oas, source: FRED, metric: BAMLC0A0CM, label: "投资级 OAS" }
    - { key: fed_balance_sheet, source: FRED, metric: WALCL, label: "联储资产负债表" }
    - { key: reverse_repo, source: FRED, metric: RRPONTSYD, label: "逆回购" }
    - { key: treasury_general_account, source: FRED, metric: WTREGEN, label: "财政部 TGA" }
    - { key: bank_reserves, source: FRED, metric: WRESBAL, label: "银行准备金" }
    - { key: move_index, source: FRED, metric: MOVE, label: "MOVE 指数" }
  equity_structure:
    - { key: breadth_above_ma200, source: computed, metric: breadth, label: "200 日均线上方比例" }
    - { key: new_highs_lows, source: computed, metric: breadth, label: "新高-新低" }
    - { key: equal_weight_divergence, source: computed, metric: breadth, label: "等权-加权背离" }
    - { key: small_cap_relative, source: computed, metric: breadth, label: "小盘相对强弱" }
    - { key: semis_relative, source: computed, metric: breadth, label: "半导体相对强弱" }
  volatility:
    - { key: vix, source: FRED, metric: VIXCLS, label: "VIX" }
    - { key: vix_term_structure, source: CBOE, metric: VIX9D/VIX3M, label: "VIX 期限结构" }
    - { key: realized_vol, source: computed, metric: vol, label: "实现波动率" }
    - { key: vol_risk_premium, source: computed, metric: vol, label: "波动率风险溢价" }
  cross_asset:
    - { key: cross_asset_confirmation, source: computed, metric: cross_asset, label: "跨资产确认信号" }
  trend:
    - { key: price_vs_ma50, source: computed, metric: trend, label: "价格 vs MA50" }
    - { key: price_vs_ma200, source: computed, metric: trend, label: "价格 vs MA200" }
    - { key: drawdown_52w, source: computed, metric: trend, label: "52 周高点回撤" }
    - { key: momentum_3m, source: computed, metric: trend, label: "3M 动量" }

# 子指标 → 0-100 映射（默认：5Y 历史百分位窗口，架构 P0-5 方法论 v1）
scoring:
  percentile_window_years: 5
  fallback_percentile: 50.0

# 风险等级阈值（总风险分 0-100）
thresholds:
  risk_level:
    risk_on: { lt: 20 }
    low_risk: { gte: 20, lt: 40 }
    caution: { gte: 40, lt: 60 }
    high_risk: { gte: 60, lt: 80 }
    severe_risk: { gte: 80, lt: 90 }
    crisis: { gte: 90 }

# 置信度 = f(数据质量, 指标覆盖度, 信号一致性)（产品级定义，非统计严格，架构 P0-5）
confidence:
  weights: { data_quality: 0.4, coverage: 0.4, consistency: 0.2 }
  degrade_factor_per_fallback: 0.8

disclaimer: "本页风险分数为模型化的市场压力估计，并非精确的崩盘概率，不构成投资建议。"
