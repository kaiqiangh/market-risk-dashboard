# ============================================================
# Risk model configuration (architecture §3.2 frozen 6-dimension weights; configurable + renormalization)
# When a dimension's coverage=0, its weight is redistributed proportionally across the remaining dimensions,
# and confidence_factors.coverage is lowered accordingly.
# ============================================================
model_version: "1.0.0"

dimensions:
  macro: { weight: 20 }
  liquidity_credit: { weight: 20 }
  equity_structure: { weight: 20 }
  volatility: { weight: 15 }
  cross_asset: { weight: 15 }
  trend: { weight: 10 }

# Per-dimension indicator mapping (MVP level; T03 fills indicators from this table; the detailed signal list in this file is authoritative)
indicators:
  macro:
    - { key: real_rate_dfii10, source: FRED, metric: DFII10, label: "10Y Real Rate", weight: 5 }
    - { key: yield_curve_10y2y, source: FRED, metric: DGS10-DGS2, label: "10Y-2Y Term Spread", weight: 5 }
    - { key: dollar_index, source: FRED, metric: DTWEXBGS, label: "Dollar Index", weight: 5 }
    - { key: dgs10, source: FRED, metric: DGS10, label: "10Y Yield", weight: 5 }
  liquidity_credit:
    - { key: hy_oas, source: FRED, metric: BAMLH0A0HYM2, label: "High Yield OAS", weight: 10 }
    - { key: ig_oas, source: FRED, metric: BAMLC0A0CM, label: "Investment Grade OAS", weight: 5 }
    - { key: fed_balance_sheet, source: FRED, metric: WALCL, label: "Fed Balance Sheet", weight: 5 }
    - { key: reverse_repo, source: FRED, metric: RRPONTSYD, label: "Reverse Repo", weight: 5 }
  equity_structure:
    - { key: breadth_above_ma200, source: computed, metric: breadth, label: "Pct Above 200-Day MA", weight: 7 }
    - { key: new_highs_ratio, source: computed, metric: breadth, label: "New Highs Ratio", weight: 4 }
    - { key: new_lows_ratio, source: computed, metric: breadth, label: "New Lows Ratio", weight: 4 }
    - {
        key: small_cap_relative,
        source: computed,
        metric: breadth,
        label: "Small Cap Relative Strength",
        weight: 4,
      }
    - {
        key: semis_relative,
        source: computed,
        metric: breadth,
        label: "Semiconductors Relative Strength",
        weight: 4,
      }
  volatility:
    - { key: vix, source: FRED, metric: VIXCLS, label: "VIX", weight: 8 }
    - { key: realized_vol, source: computed, metric: vol, label: "Realized Volatility", weight: 7 }
  cross_asset:
    - {
        key: cross_asset_confirmation,
        source: computed,
        metric: cross_asset,
        label: "Cross-Asset Confirmation Signal",
        weight: 15,
      }
  trend:
    - { key: price_vs_ma200, source: computed, metric: trend, label: "Price vs MA200", weight: 3 }
    - { key: drawdown_52w, source: computed, metric: trend, label: "52-Week High Drawdown", weight: 3 }
    - { key: momentum_3m, source: computed, metric: trend, label: "3M Momentum", weight: 4 }

# Sub-indicator → 0-100 mapping (default: 5Y historical percentile window, architecture P0-5 methodology v1)
scoring:
  percentile_window_years: 5
  fallback_percentile: 50.0

# Evidence state is separate from provider freshness: it describes how much of the model's
# configured indicator weight has usable evidence. Below this threshold, the point estimate
# is published with an insufficient-evidence state and an explicit score range.
evidence:
  insufficient_coverage_threshold: 0.5

# Calibration policy decision from the point-in-time production-path replay (#141/#142).
# The live score remains provisional: no weights or thresholds are refit from latest-source
# history because source vintages and regime-labelled out-of-sample evidence are unavailable.
calibration_policy:
  version: "1.0.0"
  status: provisional
  decisions:
    dimension_weights:
      macro: retain
      liquidity_credit: retain
      equity_structure: retain
      volatility: retain
      cross_asset: retain
      trend: retain
    indicator_weights:
      real_rate_dfii10: retain
      yield_curve_10y2y: retain
      dollar_index: retain
      dgs10: retain
      hy_oas: retain
      ig_oas: retain
      fed_balance_sheet: retain
      reverse_repo: retain
      breadth_above_ma200: retain
      new_highs_ratio: retain
      new_lows_ratio: retain
      small_cap_relative: retain
      semis_relative: retain
      vix: retain
      realized_vol: retain
      cross_asset_confirmation: gate
      price_vs_ma200: retain
      drawdown_52w: retain
      momentum_3m: retain
    risk_level_thresholds:
      risk_on: retain
      low_risk: retain
      caution: retain
      high_risk: retain
      severe_risk: retain
      crisis: retain
    confidence_formula:
      data_quality: retain
      coverage: retain
      consistency: retain
    cross_asset_aggregation:
      cross_asset_confirmation: gate
  limitations:
    - "Latest-source history is revised and is not point-in-time vintage data."
    - "The confidence field is a data-trust score, not statistical confidence or a calibrated probability."
    - "Cross-asset confirmation remains proxy-backed until its deferred signals have governed inputs."

# Risk level thresholds (total risk score 0-100)
thresholds:
  risk_level:
    risk_on: { lt: 20 }
    low_risk: { gte: 20, lt: 40 }
    caution: { gte: 40, lt: 60 }
    high_risk: { gte: 60, lt: 80 }
    severe_risk: { gte: 80, lt: 90 }
    crisis: { gte: 90 }

# Confidence = f(data quality, indicator coverage, signal consistency) (product-level definition, not statistically strict, architecture P0-5)
confidence:
  weights: { data_quality: 0.4, coverage: 0.4, consistency: 0.2 }
  # #69: how much less an estimate (proxy indicator) counts toward coverage than a
  # directly measured value. Its own knob — deliberately independent of
  # degrade.data_quality_degrade_factor (that is the per-failed-input factor).
  proxy_discount_factor: 0.8

disclaimer: "The risk score on this page is a model-based estimate of market stress. Data trust is not statistical confidence, a calibrated probability, or investment advice."
