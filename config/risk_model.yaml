# ============================================================
# Risk model configuration (architecture §3.2 frozen 6-dimension weights; configurable + renormalization)
# When a dimension's coverage=0, its weight is redistributed proportionally across the remaining dimensions,
# and confidence_factors.coverage is lowered accordingly.
# ============================================================
model_version: "1.0.0"

dimensions:
  macro: { weight: 20 }
  liquidity_credit: { weight: 20 }
  equity_structure: { weight: 20 }
  volatility: { weight: 15 }
  cross_asset: { weight: 15 }
  trend: { weight: 10 }

# Per-dimension indicator mapping (MVP level; T03 fills indicators from this table; the detailed signal list in this file is authoritative)
indicators:
  macro:
    - { key: real_rate_dfii10, source: FRED, metric: DFII10, label: "10Y Real Rate" }
    - { key: yield_curve_10y2y, source: FRED, metric: DGS10-DGS2, label: "10Y-2Y Term Spread" }
    - { key: dollar_index, source: FRED, metric: DTWEXBGS, label: "Dollar Index" }
    - { key: dgs10, source: FRED, metric: DGS10, label: "10Y Yield" }
  liquidity_credit:
    - { key: hy_oas, source: FRED, metric: BAMLH0A0HYM2, label: "High Yield OAS" }
    - { key: ig_oas, source: FRED, metric: BAMLC0A0CM, label: "Investment Grade OAS" }
    - { key: fed_balance_sheet, source: FRED, metric: WALCL, label: "Fed Balance Sheet" }
    - { key: reverse_repo, source: FRED, metric: RRPONTSYD, label: "Reverse Repo" }
  equity_structure:
    - { key: breadth_above_ma200, source: computed, metric: breadth, label: "Pct Above 200-Day MA" }
    - { key: new_highs_ratio, source: computed, metric: breadth, label: "New Highs Ratio" }
    - { key: new_lows_ratio, source: computed, metric: breadth, label: "New Lows Ratio" }
    - {
        key: small_cap_relative,
        source: computed,
        metric: breadth,
        label: "Small Cap Relative Strength",
      }
    - {
        key: semis_relative,
        source: computed,
        metric: breadth,
        label: "Semiconductors Relative Strength",
      }
  volatility:
    - { key: vix, source: FRED, metric: VIXCLS, label: "VIX" }
    - { key: realized_vol, source: computed, metric: vol, label: "Realized Volatility" }
  cross_asset:
    - {
        key: cross_asset_confirmation,
        source: computed,
        metric: cross_asset,
        label: "Cross-Asset Confirmation Signal",
      }
  trend:
    - { key: price_vs_ma200, source: computed, metric: trend, label: "Price vs MA200" }
    - { key: drawdown_52w, source: computed, metric: trend, label: "52-Week High Drawdown" }
    - { key: momentum_3m, source: computed, metric: trend, label: "3M Momentum" }

# Sub-indicator → 0-100 mapping (default: 5Y historical percentile window, architecture P0-5 methodology v1)
scoring:
  percentile_window_years: 5
  fallback_percentile: 50.0

# Risk level thresholds (total risk score 0-100)
thresholds:
  risk_level:
    risk_on: { lt: 20 }
    low_risk: { gte: 20, lt: 40 }
    caution: { gte: 40, lt: 60 }
    high_risk: { gte: 60, lt: 80 }
    severe_risk: { gte: 80, lt: 90 }
    crisis: { gte: 90 }

# Confidence = f(data quality, indicator coverage, signal consistency) (product-level definition, not statistically strict, architecture P0-5)
confidence:
  weights: { data_quality: 0.4, coverage: 0.4, consistency: 0.2 }

disclaimer: "The risk score on this page is a model-based estimate of market stress, not a precise probability of a market crash, and should not be considered investment advice."
