# Python suite + F821 gate (part of #74).
#
# Why this exists: the repo had zero CI that ran `pytest tests/pipeline/` — the hermetic
# suite #61 built, the fixture work in #73, and the named tests on every ticket on this
# board only ran if a developer remembered to run them by hand.
#
# Deliberately NOT path-filtered. A path filter on the Python job would be the exact
# defect #74 exists to fix: a PR touching only `tests/` or `pipeline/` would silently
# skip the suite. This job runs on every pull request and on every push to dev/main.
#
# Lint policy (board ruling on #60, item 5): F821 (undefined name) is the only fatal
# lint — `ruff check . --select F821`. Everything else is advisory; there is never a
# numeric threshold, because a "fewer than N warnings" gate is a ratchet nobody reads
# and everyone games.
name: Test Pipeline

on:
  pull_request:
  push:
    branches: [dev, main]

# Minimal CI permissions (Architecture §8.14: read-only)
permissions:
  contents: read

concurrency:
  group: test-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    # Fail hung runners instead of burning the 6h default (#190)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies (incl. dev extras)
        run: |
          python -m pip install --constraint constraints/py312.txt -e ".[dev]"

      - name: Run pipeline test suite with coverage
        run: |
          python -m pytest tests/pipeline/ --cov=pipeline --cov-report=term-missing --cov-report=xml
          python -m coverage report -m | tee /tmp/python-coverage.txt

      - name: Publish Python coverage summary
        if: always()
        run: |
          {
            echo "## Python coverage"
            if [ -f /tmp/python-coverage.txt ]; then
              echo '```text'
              cat /tmp/python-coverage.txt
              echo '```'
            else
              echo "Coverage report unavailable."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate committed data (full authority, contract, and secret gates)
        run: scripts/validate_data.sh --scheduled --data-dir public/data

      - name: Validate committed data (Node structural companion)
        run: node scripts/validate-json.mjs --data-dir public/data

      - name: Point-in-time production-path calibration replay
        run: python scripts/calibrate_production.py --panel tests/fixtures/calibration_panel.json --out artifacts/calibration/production-path.json

      - name: F821 must fail the build (everything else advisory)
        run: ruff check . --select F821

      - name: Ruff advisory report
        if: always()
        continue-on-error: true
        run: |
          set +e
          ruff check . --output-format=json > /tmp/ruff-advisory.json
          ruff_code=$?
          set -e
          python - "$ruff_code" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import sys

          try:
              findings = json.load(open("/tmp/ruff-advisory.json", encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              findings = []
          print("## Ruff advisory")
          print(f"- `ruff check .` exit code: {sys.argv[1]}")
          print(f"- Findings: {len(findings)}")
          PY
          exit 0

  frontend:
    runs-on: ubuntu-latest
    # Fail hung runners instead of burning the 6h default (#190)
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Check translation files
        run: npm run check:i18n

      - name: Check language isolation
        run: npm run check:language

      - name: Validate JSON data
        run: npm run check:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: npm test -- --coverage

      - name: Publish frontend coverage summary
        if: always()
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require("node:fs");
          const path = "coverage/coverage-summary.json";
          console.log("## Frontend coverage");
          if (!fs.existsSync(path)) {
            console.log("Coverage report unavailable.");
            process.exit(0);
          }
          const total = JSON.parse(fs.readFileSync(path, "utf8")).total;
          console.log("| Metric | Covered | Total | Percent |");
          console.log("| --- | ---: | ---: | ---: |");
          for (const key of ["lines", "statements", "functions", "branches"]) {
            const metric = total[key];
            console.log(`| ${key} | ${metric.covered} | ${metric.total} | ${metric.pct}% |`);
          }
          NODE

      - name: Build
        run: npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Fail hung runners instead of burning the 6h default (#190)
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@595b5aeba73380359d98a5e087f648dbb0edce1b # v4.7.3
