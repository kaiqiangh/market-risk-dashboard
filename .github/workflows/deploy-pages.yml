# GitHub Pages 部署（架构 §1.1：仅构建+部署，不采集数据、无 Secrets）
# 数据采集在本机 Scheduled Task 完成并 push 到仓库；本 workflow 只消费已提交内容。
name: Deploy Pages

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# CI 权限最小化（架构 §8.14）
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PRD §20.1 构建链：校验翻译文件 → 校验 JSON Schema → ESLint → TS check → 测试 → 构建 → 部署
      - name: Check translation files
        run: npm run check:i18n

      - name: Validate JSON data
        run: npm run check:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
