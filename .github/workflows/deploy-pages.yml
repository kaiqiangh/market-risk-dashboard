# GitHub Pages deployment (Architecture §1.1: build + deploy only; no data collection, no Secrets)
# Data collection is done by the local Scheduled Task and pushed to the repo; this workflow only consumes committed content.
name: Deploy Pages

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Minimal CI permissions (Architecture §8.14)
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # PRD §20.1 build chain: check translation files → validate JSON Schema → ESLint → TS check → test → build → deploy
      - name: Check translation files
        run: npm run check:i18n

      - name: Check language isolation
        run: npm run check:language

      - name: Validate JSON data
        run: npm run check:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
