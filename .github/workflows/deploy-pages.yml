# GitHub Pages deployment (Architecture §1.1: build + deploy only; no data collection, no Secrets)
# Data collection is done by the local Scheduled Task and pushed to the repo; this workflow only consumes committed content.
name: Deploy Pages

on:
  push:
    branches: [dev, main]
  workflow_dispatch:

# Minimal CI permissions (Architecture §8.14)
permissions:
  contents: read

# Per-branch serialization: dev and main deploy independently and never cancel each
# other; only pushes to the same branch cancel an in-flight Pages run.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pipeline validation dependencies
        run: |
          python -m pip install --constraint constraints/py312.txt pydantic pydantic-settings pyyaml

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Validate committed data (full Python authority)
        run: python -m pipeline.validation.ci_checks --data-dir public/data

      - name: Check generated contracts
        run: npm run check:contracts

      # PRD §20.1 build chain: check translation files → validate JSON Schema → ESLint → TS check → test → build → deploy
      - name: Check translation files
        run: npm run check:i18n

      - name: Check language isolation
        run: npm run check:language

      - name: Validate JSON data (Node structural companion)
        run: npm run check:data

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Secret scan (mandatory before artifact upload)
        run: node scripts/scan-secrets.mjs --root .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
