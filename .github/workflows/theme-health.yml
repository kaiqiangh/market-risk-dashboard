# Periodic theme symbol health gate (#175).
#
# Read-only monitor for the committed public/data: runs the symbol_health CLI, which
# derives the canonical theme-symbol set from config/themes.yaml (same predicate as
# MarketCollector._theme_history_symbols) and fails whenever the latest committed run
# telemetry (metadata/sources.json -> domains.market.collection_telemetry.missing_inputs
# / .degraded_inputs) names one of those symbols.
#
# Purpose: catch a delisted theme symbol the day after the first failed pipeline run,
# instead of the chronic Degraded cascade from #171 (ABB/FI) silently degrading
# sectors → market → dashboard → factlayer → analysis for weeks.
#
# No data collection, no Secrets, minimal CI permissions (Architecture §8.14).
name: Theme Symbol Health

on:
  schedule:
    # Daily 04:00 UTC — after the previous day's post-market pipeline window (~20:30 UTC),
    # before the first run of the day, so the gate evaluates the latest committed telemetry.
    - cron: "0 4 * * *"
  workflow_dispatch:

# Minimal CI permissions (Architecture §8.14: read-only)
permissions:
  contents: read

jobs:
  check-theme-symbol-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --constraint constraints/py312.txt pydantic pydantic-settings pyyaml

      - name: "Theme symbol health gate (#175)"
        run: python -m pipeline.validation.symbol_health --data-dir public/data
