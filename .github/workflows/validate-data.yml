# Data validation workflow (Architecture §5#1 / PRD §20.2).
# Decision note: kept as a **read-only validation gate** — only validates the committed public/data, does not collect data,
# no Secrets, no scheduled tasks; triggered by PR (path-filtered) + manual dispatch.
# This workflow does not block main deployment (deploy-pages.yml remains "build + deploy only"),
# data quality issues are caught in PR review and fixed in the local pipeline.
name: Validate Data

on:
  pull_request:
    paths:
      - "public/data/**"
      - "pipeline/validation/**"
      # pipeline/schemas/** is watched because every downstream ticket on this board adds
      # required fields there. When a schema changes, the committed public/data does not
      # yet match the new contract, so this gate turns RED and must stay red until the
      # scheduled run regenerates the data (docs/operations/scheduled-task.md §3).
      # expected-red window: a red run on a schema-change PR is the system working, not
      # a mistake — do not add a bypass, continue-on-error, or a label-gated skip.
      - "pipeline/schemas/**"
      - "scripts/gen_ts_contracts.py"
      - "scripts/gen_contracts.sh"
      - "src/schemas/generated/**"
      # The i18n gate (check:i18n enforces en/zh parity) must fire when translation files
      # change — otherwise an i18n-only PR skips the only gate that checks it.
      - "src/i18n/**"
      - "scripts/validate_data.sh"
      - "scripts/validate-json.mjs"
      - "scripts/scan-secrets.mjs"
      - "config/sources.yaml"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

# Minimal CI permissions (Architecture §8.14: read-only)
permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --constraint constraints/py312.txt pydantic pydantic-settings pyyaml

      - name: Validate committed data (comprehensive)
        run: python -m pipeline.validation.ci_checks --data-dir public/data

      - name: "Theme symbol health gate (#175): configured theme symbols must not be missing/degraded in latest telemetry"
        run: python -m pipeline.validation.symbol_health --data-dir public/data

      - name: Validate committed data (Node structural companion)
        run: node scripts/validate-json.mjs --data-dir public/data

      - name: "Contract drift gate (#101): regenerate and diff"
        run: npm run check:contracts

      - name: "Secret scan (S-1/#92): keys must not reach the published tree"
        run: node scripts/scan-secrets.mjs --root .

      - name: Check i18n translation files
        run: node scripts/check-i18n.mjs
