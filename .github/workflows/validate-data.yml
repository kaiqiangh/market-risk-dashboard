# 数据校验 workflow（架构 §5#1 / PRD §20.2）。
# 决策说明：作为**只读校验门槛**保留——仅校验已提交的 public/data，不采集数据、
# 无 Secrets、无定时任务；触发方式为 PR（路径过滤）+ 手动触发。
# 该 workflow 不阻塞 main 部署（deploy-pages.yml 保持"仅构建+部署"），
# 数据质量问题由 PR 评审发现并在本地管道修复。
name: Validate Data

on:
  pull_request:
    paths:
      - "public/data/**"
      - "pipeline/validation/**"
      - "scripts/validate_data.sh"
      - "scripts/validate-json.mjs"
      - "config/sources.yaml"
      - ".github/workflows/validate-data.yml"
  workflow_dispatch:

# CI 权限最小化（架构 §8.14：只读）
permissions:
  contents: read

concurrency:
  group: validate-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pipeline dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pydantic pydantic-settings pyyaml

      - name: Validate committed data (comprehensive)
        run: python -m pipeline.validation.ci_checks --data-dir public/data

      - name: Validate committed data (Node structural, fallback)
        run: node scripts/validate-json.mjs --data-dir public/data

      - name: Check i18n translation files
        run: node scripts/check-i18n.mjs
