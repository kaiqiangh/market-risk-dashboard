[project]
name = "market-risk-dashboard"
version = "0.1.0"
description = "Global Market Risk Intelligence Dashboard — data pipeline (collection / indicators / risk / fact layer / storage)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "curl_cffi>=0.16.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "scipy>=1.13.0",
  "statsmodels>=0.14.0",
  "feedparser>=6.0.10",
  "yfinance>=0.2.40",
  "akshare>=1.14.0",
  "python-dotenv>=1.0.1",
  "orjson>=3.10.0",
  "brotli>=1.1.0",
  "PyYAML>=6.0.1",
  # Trading-day gate (ADR-0006): XNYS + XSHG calendars for the automation layer.
  # Imported only by pipeline/schedule/trading_day.py, never by the pipeline itself.
  "exchange_calendars>=4.5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "respx>=0.21.0",
  # ruff runs the F821 gate in CI (test-pipeline.yml); pinned here so `pip install -e ".[dev]"` installs it
  "ruff>=0.16.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests/pipeline"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# Shared knowledge: akshare is imported only inside AkshareProvider (isolating the blast radius of anti-scraping changes; other modules must not import akshare directly).
# This constraint was enforced when T03 implemented the providers; this repo's CI can add a ruff custom rule for supplementary checks.
